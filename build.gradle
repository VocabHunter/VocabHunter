import com.github.spotbugs.snom.Confidence
import com.github.spotbugs.snom.Effort
import com.github.spotbugs.snom.SpotBugsTask
import org.gradle.internal.os.OperatingSystem

plugins {
    id "base"
    id "com.github.ben-manes.versions" version "0.47.0"
    id "net.researchgate.release" version "3.2.0"
    id "org.sonarqube" version "3.5.0.2730"
    id "com.github.spotbugs" version "6.5.15" apply false
}

ext {
    operatingSystem = OperatingSystem.current()
}

allprojects {
    group = 'io.github.vocabhunter'
}

wrapper {
    description = 'Setup the Gradle wrapper'
    gradleVersion = '9.9.2'
    distributionUrl = "https://services.gradle.org/distributions/gradle-${gradleVersion}-all.zip"
}

subprojects {

    apply plugin: 'java'
    apply plugin: 'pmd'
    apply plugin: 'checkstyle'
    apply plugin: 'com.github.spotbugs'
    apply plugin: 'jacoco'

    java {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    repositories {
        mavenCentral()
    }

    dependencies {
        testImplementation 'org.junit.jupiter:junit-jupiter:5.9.3'
        testImplementation 'org.mockito:mockito-junit-jupiter:5.3.1'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.9.3'
        runtimeOnly 'ch.qos.logback:logback-classic:1.4.8'
    }

    test {
        useJUnitPlatform()
    }

    pmd {
        toolVersion = '6.55.0'
        ruleSetFiles = files("$rootProject.projectDir/config/pmd/ruleset.xml")
        ruleSets = []
    }

    checkstyle {
        toolVersion = '10.11.0'
        configFile = file("$rootProject.projectDir/config/checkstyle/checkstyle.xml")
    }

    spotbugs {
        toolVersion = '4.7.3'
        effort = Effort.MAX
        reportLevel = Confidence.valueOf('MEDIUM')
        excludeFilter = file("$rootProject.projectDir/config/spotbugs/excludeFilter.xml")
    }

    tasks.withType(SpotBugsTask).configureEach {
        reports {
            create('html') {
                required = true
            }
        }
    }

    jacoco {
        toolVersion = '0.8.10'
    }

    jacocoTestReport {
        reports {
            xml.required = true
            xml.outputLocation = layout.buildDirectory.file('reports/jacoco/report.xml')
        }
    }

    [compileJava, compileTestJava].each { task ->
        task.options.compilerArgs << "-Xlint:unchecked" << "-Xlint:deprecation" << "-Werror"
    }
}
